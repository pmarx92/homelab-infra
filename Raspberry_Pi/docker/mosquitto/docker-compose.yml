services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /etc/mosquitto/credentials:/etc/mosquitto/credentials:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
