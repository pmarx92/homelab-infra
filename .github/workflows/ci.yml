name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  docker-compose-check:
    name: Validate and build Docker Compose stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate InfluxDB Compose config
        run: docker compose -f debian01/docker/influxdb/docker-compose.yml config
